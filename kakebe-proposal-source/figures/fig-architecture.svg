sh</text><text x="440" y="407" font-size="10.5" font-weight="400" fill="#5c5c5c" text-anchor="middle">FCM · Apple</text><rect x="508" y="352" width="116" height="82" rx="8" fill="#fff" stroke="#cfcfcf" stroke-width="1.2"/><text x="566" y="391" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Maps</text><text x="566" y="407" font-size="10.5" font-weight="400" fill="#5c5c5c" text-anchor="middle">districts, sites</text><rect x="634" y="352" width="116" height="82" rx="8" fill="#fff" stroke="#cfcfcf" stroke-width="1.2"/><text x="692" y="391" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Payments</text><text x="692" y="407" font-size="10.5" font-weight="400" fill="#5c5c5c" text-anchor="middle">optional upgrade</text>
