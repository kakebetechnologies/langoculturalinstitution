<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" role="img" aria-label="Offline-first behaviour: record, save on the phone, send when connected, stored once, reviewed, then notified" font-family="Inter, 'Segoe UI', sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c5c5c"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E01E26"/></marker>
</defs>
<text x="10" y="18" font-size="10.5" font-weight="700" fill="#1F5FA8" text-anchor="start">ON THE PHONE</text><rect x="10" y="30" width="168" height="62" rx="8" fill="#fff" stroke="#1F5FA8" stroke-width="1.3"/><circle cx="26" cy="46" r="10" fill="#1F5FA8"/><text x="26" y="50" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="44" y="51" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Record</text><text x="24" y="72" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="start">story, photo, GPS, voice</text><rect x="206" y="30" width="168" height="62" rx="8" fill="#fff" stroke="#1F5FA8" stroke-width="1.3"/><circle cx="222" cy="46" r="10" fill="#1F5FA8"/><text x="222" y="50" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="240" y="51" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Save on the phone</text><text x="220" y="72" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="start">with a unique reference</text><path d="M178 61H204" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)"/><path d="M374 61H402" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)"/><polygon points="470,24 538,61 470,98 402,61" fill="#fff" stroke="#111111" stroke-width="1.4"/><text x="470" y="58" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">Connection</text><text x="470" y="73" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">available?</text><path d="M538 61H570" fill="none" stroke="#E01E26" stroke-width="1.4" marker-end="url(#arr)"/><text x="554" y="52" font-size="10.5" font-weight="700" fill="#E01E26" text-anchor="middle">yes</text><rect x="572" y="30" width="178" height="62" rx="8" fill="#fff" stroke="#E01E26" stroke-width="1.3"/><circle cx="588" cy="46" r="10" fill="#E01E26"/><text x="588" y="50" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="606" y="51" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Send to the server</text><text x="586" y="72" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="start">automatically</text><path d="M446 88V148" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)"/><text x="436" y="124" font-size="10.5" font-weight="700" fill="#5c5c5c" text-anchor="end">no</text><path d="M494 148V88" fill="none" stroke="#1F5FA8" stroke-width="1.4" marker-end="url(#ar)"/><text x="504" y="124" font-size="10.5" font-weight="700" fill="#1F5FA8" text-anchor="start">retry when online</text><rect x="372" y="150" width="196" height="62" rx="8" fill="#f6f6f6" stroke="#cfcfcf" stroke-width="1.3"/><text x="386" y="171" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Wait in the outbox</text><text x="386" y="192" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="start">banner shown, nothing is lost</text><text x="10" y="246" font-size="10.5" font-weight="700" fill="#E01E26" text-anchor="start">ON THE SERVER</text><path d="M660 92V256" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)"/><rect x="572" y="258" width="178" height="62" rx="8" fill="#fff" stroke="#E01E26" stroke-width="1.3"/><circle cx="588" cy="274" r="10" fill="#E01E26"/><text x="588" y="278" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="606" y="279" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Store it once</text><text x="586" y="300" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="start">duplicates are ignored</text><rect x="358" y="258" width="178" height="62" rx="8" fill="#fff" stroke="#E01E26" stroke-width="1.3"/><circle cx="374" cy="274" r="10" fill="#E01E26"/><text x="374" y="278" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="392" y="279" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Review queue</text><text x="372" y="300" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="start">moderator decides</text><rect x="144" y="258" width="178" height="62" rx="8" fill="#fff" stroke="#E01E26" stroke-width="1.3"/><circle cx="160" cy="274" r="10" fill="#E01E26"/><text x="160" y="278" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="178" y="279" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Notify the phone</text><text x="158" y="300" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="start">in-app and push</text><path d="M572 289H538" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)"/><path d="M358 289H324" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)"/>
</svg>