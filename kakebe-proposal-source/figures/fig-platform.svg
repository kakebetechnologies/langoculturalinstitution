<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" role="img" aria-label="One platform with three surfaces sharing one API, one database and one review queue" font-family="Inter, 'Segoe UI', sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c5c5c"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E01E26"/></marker>
</defs>
<rect x="10" y="10" width="230" height="132" rx="8" fill="#fff" stroke="#E01E26" stroke-width="1.4"/><path d="M10 18a8 8 0 0 1 8 -8h214a8 8 0 0 1 8 8v26h-230z" fill="#E01E26"/><text x="125" y="32" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Public website</text><text x="24" y="64" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">History, districts and clans</text><text x="24" y="82" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Language Hub and translator</text><text x="24" y="100" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">News, events, giving, forms</text><text x="24" y="130" font-size="10.5" font-weight="400" fill="#5c5c5c" text-anchor="start" font-style="italic">For everyone, on any device</text><rect x="265" y="10" width="230" height="132" rx="8" fill="#fff" stroke="#111111" stroke-width="1.4"/><path d="M265 18a8 8 0 0 1 8 -8h214a8 8 0 0 1 8 8v26h-230z" fill="#111111"/><text x="380" y="32" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Admin control panel</text><text x="279" y="64" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Publish, review and translate</text><text x="279" y="82" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Six roles, audit log, backups</text><text x="279" y="100" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Moderation queue and reports</text><text x="279" y="130" font-size="10.5" font-weight="400" fill="#5c5c5c" text-anchor="start" font-style="italic">For Foundation staff</text><rect x="520" y="10" width="230" height="132" rx="8" fill="#fff" stroke="#1F5FA8" stroke-width="1.4"/><path d="M520 18a8 8 0 0 1 8 -8h214a8 8 0 0 1 8 8v26h-230z" fill="#1F5FA8"/><text x="635" y="32" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Lango Mobile App</text><text x="534" y="64" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Offline dictionary, translator</text><text x="534" y="82" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Record with GPS, photo, voice</text><text x="534" y="100" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Push alerts, points, badges</text><text x="534" y="130" font-size="10.5" font-weight="400" fill="#5c5c5c" text-anchor="start" font-style="italic">Android, iOS and web app</text><path d="M125 142V190" fill="none" stroke="#E01E26" stroke-width="1.4" marker-end="url(#arr)"/><path d="M380 142V190" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#ar)"/><path d="M635 142V190" fill="none" stroke="#1F5FA8" stroke-width="1.4" marker-end="url(#ar)"/><rect x="10" y="190" width="740" height="58" rx="8" fill="#f6f6f6" stroke="#111111" stroke-width="1.6"/><text x="380" y="215" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">One JSON API</text><text x="380" y="235" font-size="11.5" font-weight="400" fill="#5c5c5c" text-anchor="middle">Accounts · roles · secure tokens · rate limits · English and Leb Lango</text><path d="M125 248V292" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)"/><path d="M380 248V292" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)"/><path d="M635 248V292" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)"/><rect x="10" y="292" width="230" height="92" rx="8" fill="#fff" stroke="#cfcfcf" stroke-width="1.2"/><text x="125" y="314" font-size="12.5" font-weight="700" fill="#111111" text-anchor="middle">Content and language</text><text x="125" y="334" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="middle">Clans, districts, history</text><text x="125" y="350" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="middle">Dictionary, proverbs, lessons</text><text x="125" y="366" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="middle">Members, points, badges</text><rect x="265" y="292" width="230" height="92" rx="8" fill="#fff" stroke="#cfcfcf" stroke-width="1.2"/><text x="380" y="314" font-size="12.5" font-weight="700" fill="#111111" text-anchor="middle">Media and documents</text><text x="380" y="334" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="middle">Photos, audio and video</text><text x="380" y="350" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="middle">Scans and documents</text><text x="380" y="366" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="middle">Backed up off the server</text><rect x="520" y="292" width="230" height="92" rx="8" fill="#fdecee" stroke="#E01E26" stroke-width="1.2"/><text x="635" y="314" font-size="12.5" font-weight="700" fill="#E01E26" text-anchor="middle">One review queue</text><text x="635" y="334" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="middle">Web and app contributions</text><text x="635" y="350" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="middle">Notes, decisions, archive</text><text x="635" y="366" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="middle">Alerts back to contributors</text><rect x="10" y="408" width="740" height="38" rx="8" fill="#fff" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="5 4"/><text x="380" y="432" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="middle">Connected services: email · SMS · push notifications · maps · mobile money and cards (optional) · analytics</text><path d="M380 384V408" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)" stroke-dasharray="3 3"/>
</svg>