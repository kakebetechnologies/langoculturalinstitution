<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 358" role="img" aria-label="Contribution lifecycle from capture to publication and notification" font-family="Inter, 'Segoe UI', sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c5c5c"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E01E26"/></marker>
</defs>
<g transform="translate(0,18)"><rect x="10" y="40" width="150" height="60" rx="8" fill="#fff" stroke="#1F5FA8" stroke-width="1.3"/><circle cx="25" cy="55" r="9.5" fill="#1F5FA8"/><text x="25" y="59" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="41" y="60" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Capture</text><text x="22" y="80" font-size="10.5" font-weight="400" fill="#5c5c5c" text-anchor="start">web or app, even offline</text><rect x="186" y="40" width="150" height="60" rx="8" fill="#fff" stroke="#1F5FA8" stroke-width="1.3"/><circle cx="201" cy="55" r="9.5" fill="#1F5FA8"/><text x="201" y="59" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="217" y="60" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Submit</text><text x="198" y="80" font-size="10.5" font-weight="400" fill="#5c5c5c" text-anchor="start">tracking code issued</text><rect x="362" y="40" width="150" height="60" rx="8" fill="#fff" stroke="#cfcfcf" stroke-width="1.3"/><circle cx="377" cy="55" r="9.5" fill="#111111"/><text x="377" y="59" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="393" y="60" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Review queue</text><text x="374" y="80" font-size="10.5" font-weight="400" fill="#5c5c5c" text-anchor="start">moderator opens it</text><path d="M160 70H184" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)"/><path d="M336 70H360" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)"/><polygon points="620,26 700,70 620,114 540,70" fill="#fff" stroke="#111111" stroke-width="1.4"/><text x="620" y="66" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">Moderator</text><text x="620" y="81" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">decides</text><path d="M512 70H538" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)"/><path d="M620 26V12H85V38" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)" stroke-dasharray="4 3"/><text x="352" y="8" font-size="10.5" font-weight="400" fill="#5c5c5c" text-anchor="middle">Returned: the contributor sees the reviewer's note and can improve it</text><path d="M620 114V176" fill="none" stroke="#E01E26" stroke-width="1.4" marker-end="url(#arr)"/><text x="630" y="150" font-size="10.5" font-weight="700" fill="#E01E26" text-anchor="start">approve</text><rect x="516" y="178" width="210" height="70" rx="8" fill="#fff" stroke="#E01E26" stroke-width="1.3"/><circle cx="531" cy="193" r="9.5" fill="#E01E26"/><text x="531" y="197" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="547" y="198" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Specialist check</text><text x="528" y="218" font-size="10.5" font-weight="400" fill="#5c5c5c" text-anchor="start">clan leader or Cultural Review</text><text x="528" y="233" font-size="10.5" font-weight="400" fill="#5c5c5c" text-anchor="start">Panel, where needed</text><rect x="276" y="178" width="200" height="70" rx="8" fill="#fff" stroke="#E01E26" stroke-width="1.3"/><circle cx="291" cy="193" r="9.5" fill="#E01E26"/><text x="291" y="197" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="307" y="198" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Publish and archive</text><text x="288" y="218" font-size="10.5" font-weight="400" fill="#5c5c5c" text-anchor="start">reviewer and source recorded</text><rect x="36" y="178" width="200" height="70" rx="8" fill="#fff" stroke="#E01E26" stroke-width="1.3"/><circle cx="51" cy="193" r="9.5" fill="#E01E26"/><text x="51" y="197" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="67" y="198" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Notify and recognise</text><text x="48" y="218" font-size="10.5" font-weight="400" fill="#5c5c5c" text-anchor="start">in-app, push, points, badges</text><path d="M516 211H478" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)"/><path d="M276 211H238" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)"/><path d="M700 70H744V300H700" fill="none" stroke="#5c5c5c" stroke-width="1.4" marker-end="url(#ar)"/><text x="738" y="60" font-size="10.5" font-weight="700" fill="#5c5c5c" text-anchor="end">reject</text><rect x="516" y="276" width="184" height="48" rx="8" fill="#f6f6f6" stroke="#cfcfcf" stroke-width="1.2"/><text x="608" y="297" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">Closed with a reason</text><text x="608" y="313" font-size="10.5" font-weight="400" fill="#5c5c5c" text-anchor="middle">visible to the contributor</text></g>
</svg>