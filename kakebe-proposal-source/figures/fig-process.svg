<path d="M10 10h168l22 33l-22 33h-168z" fill="#111111"/><text x="30" y="36" font-size="11" font-weight="700" fill="rgba(255,255,255,.75)" text-anchor="start">01</text><text x="30" y="58" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Discover</text><text x="22" y="104" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">• Workshops, content audit</text><text x="22" y="122" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">• Scope, roles, plan</text><path d="M196 10h168l22 33l-22 33h-168l22 -33z" fill="#E01E26"/><text x="236" y="36" font-size="11" font-weight="700" fill="rgba(255,255,255,.75)" text-anchor="start">02</text><text x="236" y="58" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Design and build</text><text x="208" y="104" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">• Two-week cycles</text><text x="208" y="122" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">• Staging site and demos</text><path d="M382 10h168l22 33l-22 33h-168l22 -33z" fill="#1F5FA8"/><text x="422" y="36" font-size="11" font-weight="700" fill="rgba(255,255,255,.75)" text-anchor="start">03</text><text x="422" y="58" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Test and launch</text><text x="394" y="104" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">• Testing, pilot, training</text><text x="394" y="122" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">• Store release, go-live</text><path d="M568 10h168l22 33l-22 33h-168l22 -33z" fill="#5c5c5c"/><text x="608" y="36" font-size="11" font-weight="700" fill="rgba(255,255,255,.75)" text-anchor="start">04</text><text x="608" y="58" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Support and grow</text><text x="580" y="104" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">• 90-day hypercare</text><text x="580" y="122" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">• Support plan, roadmap</text>
